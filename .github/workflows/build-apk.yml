name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"

          VERSION_OUTPUT=$(java -version 2>&1 || true)
          VERSION_LINE=$(printf '%s\n' "$VERSION_OUTPUT" | head -n 1)
          RAW_VERSION=$(printf '%s\n' "$VERSION_LINE" | sed -n 's/.*version "\([^"]*\)".*/\1/p')

          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Unable to detect the active Java version from: $VERSION_LINE"
            exit 1
          fi

          if [[ "$RAW_VERSION" == 1.* ]]; then
            JAVA_MAJOR=$(printf '%s\n' "$RAW_VERSION" | cut -d. -f2 | tr -cd '0-9')
          else
            JAVA_MAJOR=$(printf '%s\n' "$RAW_VERSION" | cut -d. -f1 | tr -cd '0-9')
          fi

          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse active Java major version from: $RAW_VERSION"
            exit 1
          fi

          echo "Detected active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but Java $JAVA_MAJOR is active."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            KEYTOOL_BIN="keytool"
            if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
              KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            fi

            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug, O=Android, C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi

          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "::error::Failed to create temporary debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore is present for this runner build."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected debug APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Verified path $APK_PATH exists but is empty."
            exit 1
          fi

          if [[ "$APK_PATH" != *.apk ]]; then
            echo "::error::Expected .apk extension for $APK_PATH"
            exit 1
          fi

          APK_SIZE=$(wc -c < "$APK_PATH" | tr -d ' ')
          echo "Verified debug APK: $APK_PATH (${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Cannot prepare release asset because $SOURCE_APK is missing or empty."
            exit 1
          fi

          RAW_REPO="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO=$(printf '%s' "$RAW_REPO" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="android-app"
          fi

          ASSET_NAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/release-asset-XXXXXX")
          ASSET_PATH="${TEMP_DIR}/${ASSET_NAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset is missing or empty."
            exit 1
          fi

          {
            echo "asset_dir=${TEMP_DIR}"
            echo "asset_path=${ASSET_PATH}"
            echo "asset_name=${ASSET_NAME}"
          } >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_NAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset validation failed."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **Source Commit SHA**: \`${GITHUB_SHA}\`
          - **GitHub Actions Run Number**: \`${GITHUB_RUN_NUMBER}\`
          - **GitHub Actions Run Attempt**: \`${GITHUB_RUN_ATTEMPT}\`
          - **APK Asset**: \`${ASSET_NAME}\`

          > **Note:** This APK is intended for testing only. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
            UPLOADED_ASSETS=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            echo "Confirmed Release Assets:"
            printf '%s\n' "$UPLOADED_ASSETS"

            {
              echo "## Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Title**: ${RELEASE_TITLE}"
              echo "- **Release Tag**: \`${RELEASE_TAG}\`"
              echo "- **Download Page**: ${RELEASE_URL}"
              echo "- **APK File**: \`${ASSET_NAME}\` (available directly under the release **Assets** section)"
              echo "- **Backup Artifact**: \`app-debug-apk\` is also available in this workflow run's Artifacts section."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$UPLOAD_OUTCOME" = "success" ]; then
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              echo "## Debug APK Build Succeeded (Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases failed, so no release URL was created."
              echo ""
              echo "- **APK Build Status**: Succeeded"
              echo "- **Backup Download**: Download the \`app-debug-apk\` artifact from this workflow run's **Artifacts** section."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Debug APK build or artifact upload did not complete successfully."
            {
              echo "## Debug APK Build Failed"
              echo ""
              echo "The debug APK build or artifact upload failed before release publishing."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
